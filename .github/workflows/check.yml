name: Check Substreams
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Format, lint, and regression tests
        run: make check
      - name: Build WASM
        run: make build
      - name: Validate live-check script syntax (no network)
        run: |
          bash -n scripts/live_check.sh scripts/review_bid_history.sh
          python3 -m py_compile scripts/verify_live.py scripts/verify_bid_history.py
