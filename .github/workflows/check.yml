name: Check Substreams
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Format, lint, and regression tests
        run: make check
      - name: Install Substreams CLI 1.23.0
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/streamingfast/substreams/releases/download/v1.23.0/substreams_linux_x86_64.tar.gz \
            --output substreams.tar.gz
          echo '5cfc982de073e1dd1152997e30b164b841a5b44d4cabdba6461046ea4eb1d016  substreams.tar.gz' | sha256sum --check
          tar -xzf substreams.tar.gz substreams
      - name: Build WASM and pack the manifest
        run: make pack SUBSTREAMS="$RUNNER_TEMP/substreams"
      - name: Validate live-check script syntax (no network)
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          python3 -m py_compile scripts/verify_*.py

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: punks
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Test ownership lifecycle, UTC totals, precision, and fact deletion
        env:
          PGPASSWORD: test
        run: psql -h localhost -U postgres -d punks -f tests/sql_views.sql
