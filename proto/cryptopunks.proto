syntax = "proto3";

package eth.cryptopunks.v1;


message Transfers {
  repeated Transfer transfers = 1;
}

message Transfer {
  string from = 1;
  string to = 2;
  uint64 token_id = 3;
  string wrapped = 4;
  string trx_hash = 10;
  uint64 block_number = 11;
  uint64 timestamp = 12;
  string block_hash = 13;
  // Firehose ordering ordinal, distinct from the block log index.
  uint64 ordinal = 100;
  uint32 log_index = 101;
}

message Assigns {
  repeated Assign assigns = 1;
}

message Assign {
  string to = 1;
  uint64 token_id = 2;
  optional Contract contract = 3;
  string trx_hash = 10;
  uint64 block_number = 11;
  uint64 timestamp = 12;
  string block_hash = 13;
  // Firehose ordering ordinal, distinct from the block log index.
  uint64 ordinal = 100;
  uint32 log_index = 101;
}

message Sales {
  repeated Sale sales = 1;
}

message Sale {
  // Legacy acceptBidForPunk clears its bid before emitting PunkBought.
  bool bid_accepted = 14;
  string from = 1;
  string to = 2;
  uint64 token_id = 3;
  string amount = 4;
  string trx_hash = 10;
  uint64 block_number = 11;
  uint64 timestamp = 12;
  string block_hash = 13;
  // Firehose ordering ordinal, distinct from the block log index.
  uint64 ordinal = 100;
  uint32 log_index = 101;
}

message Bids {
  repeated Bid bids = 1;
}

message Bid {
  string from = 1;
  uint64 token_id = 3;
  string amount = 4;
  string open = 5;
  string trx_hash = 10;
  uint64 block_number = 11;
  uint64 timestamp = 12;
  string block_hash = 13;
  // Firehose ordering ordinal, distinct from the block log index.
  uint64 ordinal = 100;
  uint32 log_index = 101;
}


message Asks {
  repeated Ask asks = 1;
}

message Ask {
  string from = 1;
  string to = 2;
  uint64 token_id = 3;
  optional string amount = 4;
  string open = 5;
  string trx_hash = 10;
  uint64 block_number = 11;
  uint64 timestamp = 12;
  string block_hash = 13;
  // Firehose ordering ordinal, distinct from the block log index.
  uint64 ordinal = 100;
  uint32 log_index = 101;
}


message UserProxies {
  repeated UserProxy user_proxies = 1;
}

message UserProxy {
  string user = 1;
  string proxy_address = 2;
  string trx_hash = 10;
  uint64 block_number = 11;
  uint64 timestamp = 12;
  string block_hash = 13;
  // Firehose ordering ordinal, distinct from the block log index.
  uint64 ordinal = 100;
  uint32 log_index = 101;
}

message Contract {
  string name = 1;
  string symbol = 2;
  string total_supply = 3;
  string image_hash = 4;
  string address = 5;
}

message Metadatas {
  repeated Metadata metadatas = 1;
}

message Metadata {
  string token_id = 1;
  string image = 2;
  string svg = 3;
  string traits = 4;
  string token_uri = 5;
  string contract_uri = 6;
  string punk_type = 7;
}
