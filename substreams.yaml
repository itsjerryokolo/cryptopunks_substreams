specVersion: v0.1.0
package:
  name: "itsjerryokolo_cryptopunks"
  version: v0.2.0
  url: https://github.com/itsjerryokolo/cryptopunks_substreams
  description: Ethereum CryptoPunks events, state, and Graph entity changes


network: mainnet

imports:
  eth_common: https://spkg.io/v1/packages/ethereum-common/v0.3.3
  entity: https://github.com/streamingfast/substreams-entity-change/releases/download/v0.2.1/substreams-entity-change-v0.2.1.spkg

protobuf:
  files:
    - cryptopunks.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/substreams.wasm


modules:
  - name: store_bid_events
    kind: store
    initialBlock: 3914494
    updatePolicy: set
    valueType: proto:eth.cryptopunks.v1.Bid
    inputs:
      - map: map_bids

  - name: store_bid_resets
    kind: store
    initialBlock: 3914494
    updatePolicy: set
    valueType: proto:eth.cryptopunks.v1.Bid
    inputs:
      - map: map_sales
      - map: map_transfers

  - name: map_bid_changes
    kind: map
    initialBlock: 3914494
    inputs:
      - map: map_bids
      - map: map_sales
      - map: map_transfers
      - store: store_bid_events
      - store: store_bid_resets
    output:
      type: proto:eth.cryptopunks.v1.Bids

  - name: map_resolved_sales
    kind: map
    initialBlock: 3914494
    inputs:
      - map: map_sales
      - store: store_bid_events
      - store: store_bid_resets
    output:
      type: proto:eth.cryptopunks.v1.Sales

  - name: map_assigns
    kind: map
    blockFilter:
      module: eth_common:index_events
      query:
        string: "evt_addr:0xb47e3cd837ddf8e4c57f05d70ab865de6e193bbb"
    initialBlock: 3914494
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:eth.cryptopunks.v1.Assigns


  - name: store_assigns
    kind: store
    initialBlock: 3914494
    updatePolicy: set
    valueType: proto:eth.cryptopunks.v1.Assign
    inputs:
      - map: map_assigns


  - name: map_bids
    kind: map
    blockFilter:
      module: eth_common:index_events
      query:
        string: "evt_addr:0xb47e3cd837ddf8e4c57f05d70ab865de6e193bbb"
    initialBlock: 3914494
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:eth.cryptopunks.v1.Bids


  - name: bids_state
    kind: store
    initialBlock: 3914494
    updatePolicy: set
    valueType: proto:eth.cryptopunks.v1.Bid
    inputs:
      - map: map_bid_changes

  - name: store_volume
    kind: store
    initialBlock: 3914494
    updatePolicy: add
    valueType: bigdecimal
    inputs:
      - map: map_resolved_sales
    


  - name: store_sales
    kind: store
    initialBlock: 3914494
    updatePolicy: set
    valueType: proto:eth.cryptopunks.v1.Sale
    inputs:
      - map: map_resolved_sales



  - name: map_sales
    kind: map
    blockFilter:
      module: eth_common:index_events
      query:
        string: "evt_addr:0xb47e3cd837ddf8e4c57f05d70ab865de6e193bbb"
    initialBlock: 3914494
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:eth.cryptopunks.v1.Sales


  - name: map_transfers
    kind: map
    blockFilter:
      module: eth_common:index_events
      query:
        string: "evt_addr:0xb47e3cd837ddf8e4c57f05d70ab865de6e193bbb"
    initialBlock: 3914494
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:eth.cryptopunks.v1.Transfers


  - name: punk_state
    kind: store
    initialBlock: 3914494
    updatePolicy: set
    valueType: proto:eth.cryptopunks.v1.Transfer
    inputs:
      - map: map_transfers
      - store: store_user_proxies


  - name: map_user_proxies
    kind: map
    blockFilter:
      module: eth_common:index_events
      query:
        string: "evt_addr:0xb7f7f6c52f2e2fdb1963eab30438024864c313f6"
    initialBlock: 3914494
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:eth.cryptopunks.v1.UserProxies
      

  - name: map_wrapped_transfers
    kind: map
    blockFilter:
      module: eth_common:index_events
      query:
        string: "evt_addr:0xb7f7f6c52f2e2fdb1963eab30438024864c313f6"
    initialBlock: 3914494
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:eth.cryptopunks.v1.Transfers
      

  - name: store_user_proxies
    kind: store
    initialBlock: 3914494
    updatePolicy: set
    valueType: proto:eth.cryptopunks.v1.UserProxy
    inputs:
      - map: map_user_proxies


  - name: map_asks
    kind: map
    blockFilter:
      module: eth_common:index_events
      query:
        string: "evt_addr:0xb47e3cd837ddf8e4c57f05d70ab865de6e193bbb"
    initialBlock: 3914494
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:eth.cryptopunks.v1.Asks


  - name: asks_state
    kind: store
    initialBlock: 3914494
    updatePolicy: set
    valueType: proto:eth.cryptopunks.v1.Ask
    inputs:
      - map: map_asks
      - map: map_resolved_sales

  - name: contract_metadata
    kind: store
    initialBlock: 3914494
    updatePolicy: set
    valueType: proto:eth.cryptopunks.v1.Contract
    inputs:
      - map: map_assigns


  - name: map_metadata
    kind: map
    initialBlock: 3914494
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:eth.cryptopunks.v1.Metadatas

  - name: store_metadata
    kind: store
    initialBlock: 3914494
    updatePolicy: set
    valueType: proto:eth.cryptopunks.v1.Metadata
    inputs:
      - map: map_metadata

  - name: map_metadata_entities
    kind: map
    initialBlock: 3914494
    inputs:
      - store: store_metadata
        mode: deltas
    output:
      type: proto:substreams.entity.v1.EntityChanges

  - name: map_contract_entities
    kind: map
    initialBlock: 3914494
    inputs:
      - store: contract_metadata
        mode: deltas
    output:
      type: proto:substreams.entity.v1.EntityChanges

  - name: map_transfer_entities
    kind: map
    initialBlock: 3914494
    inputs:
      - store: punk_state
        mode: deltas
    output:
      type: proto:substreams.entity.v1.EntityChanges

  - name: map_assign_entities
    kind: map
    initialBlock: 3914494
    inputs:
      - store: store_assigns
        mode: deltas
    output:
      type: proto:substreams.entity.v1.EntityChanges


  - name: map_ask_entities
    kind: map
    initialBlock: 3914494
    inputs:
      - store: asks_state
        mode: deltas
    output:
      type: proto:substreams.entity.v1.EntityChanges


  - name: map_bid_entities
    kind: map
    initialBlock: 3914494
    inputs:
      - store: bids_state
        mode: deltas
    output:
      type: proto:substreams.entity.v1.EntityChanges

  - name: map_sale_entities
    kind: map
    initialBlock: 3914494
    inputs:
      - store: store_sales
        mode: deltas
    output:
      type: proto:substreams.entity.v1.EntityChanges


  - name: graph_out
    kind: map
    initialBlock: 3914494
    inputs:
      - map: map_metadata_entities
      - map: map_contract_entities
      - map: map_transfer_entities
      - map: map_assign_entities
      - map: map_ask_entities
      - map: map_bid_entities
      - map: map_sale_entities
    output:
      type: proto:substreams.entity.v1.EntityChanges
