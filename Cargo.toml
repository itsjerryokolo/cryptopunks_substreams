[package]
name = "cryptopunks"
version = "0.2.0"
description = "Cryptopunks Substreams"
edition = "2021"
repository = "https://github.com/itsjerryokolo/cryptopunks_substreams"

[lib]
name = "substreams"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
ethabi = "17.2.0"
hex-literal = "0.3.4"
bigdecimal = "0.3.0"
prost = "0.11"
substreams-entity-change = "0.2.1"

hex = "0.4.3"

# Keep runtime/protobuf families compatible with the legacy entity output.
substreams = "0.4"
substreams-ethereum = "0.7"

# Required so that ethabi > ethereum-types build correctly under wasm32-unknown-unknown
[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[dev-dependencies]
prost-types = "0.11"

[build-dependencies]
prost-build = "0.11"
anyhow = "1"
substreams-ethereum = "0.7"

[profile.release]
lto = true
opt-level = 's'
strip = "debuginfo"
